[project]
name = "article-reconstruction"
version = "0.5.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "openai>=2.53.0",
    "python-dotenv>=1.2.2",
    "scikit-learn>=1.5.0",
    "typer>=0.27.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.commitizen]
name = "cz_conventional_commits"
version = "0.5.0"
version_files = [
    "pyproject.toml:version"
]
update_changelog_on_bump = true
