[project]
name = "article-reconstruction"
version = "0.13.0"
description = "Reconstruct complete articles from Jawi Malay newspaper OCR fragments using LLM pipelines"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "jawi-pipeline",
    "openai>=2.53.0",
    "python-dotenv>=1.2.2",
    "scikit-learn>=1.5.0",
    "typer>=0.27.1",
]

[project.scripts]
pl-article-reconstruction = "newspaper_reconstructor.pipeline_main:main"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.1",
]
# Opt-in backend for local in-process models: uv sync --group local
local = [
    "accelerate>=1.11.0",
    "torch>=2.9.0",
    "transformers>=4.57.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.commitizen]
name = "cz_conventional_commits"
version = "0.13.0"
version_files = [
    "pyproject.toml:version",
    "dashboard.html"
]
update_changelog_on_bump = true
pre_bump_hooks = ["uv lock", "git add uv.lock"]

[tool.uv.sources]
# Local sibling checkout for dev; switch to a git/source pin once the framework is released.
jawi-pipeline = { path = "../pipeline" }
